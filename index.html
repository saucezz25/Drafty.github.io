<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Drafty</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#A2C2FB" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gray: #F0F2F5;
      --card-bg: rgba(255, 255, 255, 0.92);
      --pastel-blue-light: #EBF2FF;
      --pastel-blue: #A2C2FB;
      --pastel-blue-dark: #6C9CE8;
      --accent-shadow: rgba(162, 194, 251, 0.35);
      --text-main: #4A5568;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-gray);
      font-family: 'Fredoka', cursive, sans-serif;
      color: var(--text-main);
    }

    #canvas-viewport {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-gray);
      background-image: radial-gradient(#DEE4EC 1.5px, transparent 1.5px);
      background-size: 22px 22px;
      overflow: hidden;
    }

    #canvas-wrapper {
      position: relative;
      background: white;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      border-radius: 12px;
      cursor: crosshair;
    }

    .drawing-layer {
      position: absolute;
      top: 0;
      left: 0;
      border-radius: 12px;
      pointer-events: none;
    }

    /* BARRA SUPERIOR */
    .top-bar {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      min-height: 54px;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border-radius: 28px;
      box-shadow: 0 8px 20px var(--accent-shadow);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      padding: 6px 16px;
      z-index: 50;
      border: 2px solid white;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--pastel-blue-dark);
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .pill-btn {
      background: white;
      border: 1.5px solid var(--pastel-blue-light);
      border-radius: 18px;
      padding: 6px 12px;
      color: var(--text-main);
      font-family: inherit;
      font-weight: 600;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.04);
      transition: transform 0.15s ease;
    }

    .pill-btn:active {
      transform: scale(0.92);
      background: var(--pastel-blue-light);
    }

    /* CONTROLES Y HERRAMIENTAS INFERIORES */
    .tool-settings {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      padding: 8px 16px;
      border-radius: 26px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 45;
      border: 2px solid white;
    }

    .color-picker-bubble {
      -webkit-appearance: none;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      outline: none;
      background: transparent;
    }
    .color-picker-bubble::-webkit-color-swatch-wrapper { padding: 0; }
    .color-picker-bubble::-webkit-color-swatch {
      border: 2px solid white;
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .brush-slider {
      -webkit-appearance: none;
      height: 6px;
      border-radius: 4px;
      background: #E2E8F0;
      outline: none;
      width: 90px;
    }
    .brush-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--pastel-blue-dark);
      cursor: pointer;
      border: 2px solid white;
    }

    .pressure-pill {
      font-size: 11px;
      color: #64748B;
      background: white;
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid #E2E8F0;
      white-space: nowrap;
    }

    .bottom-dock {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      padding: 6px 12px;
      border-radius: 35px;
      box-shadow: 0 12px 25px var(--accent-shadow);
      display: flex;
      gap: 6px;
      align-items: center;
      z-index: 50;
      border: 2px solid white;
    }

    .tool-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: transparent;
      font-size: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tool-btn.active {
      background: var(--pastel-blue);
      transform: translateY(-3px) scale(1.08);
      box-shadow: 0 4px 10px var(--accent-shadow);
    }

    /* PESTAÑA REFERENCIA */
    .reference-panel {
      position: absolute;
      top: 80px;
      left: 20px;
      width: 170px;
      height: 210px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      border: 3px solid var(--pastel-blue-light);
      display: flex;
      flex-direction: column;
      z-index: 60;
      overflow: hidden;
    }
    .reference-panel.hidden { display: none; }

    .reference-header {
      background: var(--pastel-blue-light);
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      color: var(--pastel-blue-dark);
      cursor: move;
    }

    .reference-img-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FAFAFA;
    }
    .reference-img-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* PANEL CAPAS */
    .layers-panel {
      position: absolute;
      right: 20px;
      top: 80px;
      width: 180px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      z-index: 55;
      border: 2px solid white;
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    .layers-panel.open { display: flex; }

    .layer-item {
      padding: 8px 10px;
      background: white;
      border-radius: 12px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .layer-item.active {
      border-color: var(--pastel-blue-dark);
      background: var(--pastel-blue-light);
    }

    /* MODAL LIBRO */
    .book-modal {
      position: fixed;
      inset: 0;
      background: rgba(43, 52, 69, 0.45);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .book-modal.open { display: flex; }

    .book-container {
      width: 88vw;
      max-width: 480px;
      height: 70vh;
      background: #FFFFFF;
      border-radius: 24px;
      border: 8px solid #D6E4F0;
      position: relative;
      display: flex;
      overflow: hidden;
    }

    .book-spine {
      width: 20px;
      background: linear-gradient(to right, #A2C2FB, #8FB5F7);
    }

    .book-content {
      padding: 16px;
      flex: 1;
      overflow-y: auto;
    }

    .pages-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .page-card {
      background: white;
      border-radius: 10px;
      padding: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border: 1px solid #E8EEF5;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .page-card img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div id="canvas-viewport">
    <div id="canvas-wrapper" style="width: 380px; height: 580px;"></div>
  </div>

  <header class="top-bar">
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 64 64" fill="none">
        <path d="M32 6C16.5 6 6 16.5 6 32c0 15 12 26 26 26 5 0 8-3 8-7 0-3-1-4.5-1-6.5 0-2.5 2-4.5 4.5-4.5H48c8 0 12-7 12-14 0-14-12.5-26-28-26z" fill="#BBD5FD"/>
        <circle cx="20" cy="24" r="4.5" fill="#FFB3BA"/>
        <circle cx="32" cy="18" r="4.5" fill="#BAFFC9"/>
        <circle cx="44" cy="24" r="4.5" fill="#FFFFBA"/>
        <circle cx="24" cy="38" r="4.5" fill="#FFDFBA"/>
      </svg>
      <span class="brand-title">Drafty</span>
    </div>

    <div class="top-actions">
      <button class="pill-btn" id="undoBtn" type="button" title="Atajo: Z">↩ <b>Z</b></button>
      <button class="pill-btn" id="redoBtn" type="button" title="Atajo: Y">↪ <b>Y</b></button>
      <button class="pill-btn" id="toggleRefBtn" type="button">🖼 Ref</button>
      <button class="pill-btn" id="layersBtn" type="button">📑 Capas</button>
      <button class="pill-btn" id="openBookBtn" type="button" style="background: var(--pastel-blue-light); color: var(--pastel-blue-dark);">📖 Libro</button>
    </div>
  </header>

  <div class="reference-panel hidden" id="refPanel">
    <div class="reference-header" id="refDragHandle">
      <span>Referencia</span>
      <span style="cursor:pointer;" id="closeRefBtn">✕</span>
    </div>
    <div class="reference-img-container">
      <img id="refImg" src="" style="display:none;" />
      <label for="refInput" id="refPlaceholder" style="font-size: 11px; text-align: center; color: #94A3B8; cursor: pointer; padding: 10px;">
        Toca aquí para cargar foto
      </label>
      <input type="file" id="refInput" accept="image/*" style="display:none;" />
    </div>
  </div>

  <div class="layers-panel" id="layersPanel">
    <div style="display:flex; justify-content:space-between; align-items:center; font-size:12px; font-weight:700;">
      <span>Capas</span>
      <button class="pill-btn" id="addLayerBtn" type="button" style="padding: 2px 8px;">+ Nueva</button>
    </div>
    <div id="layersList" style="display:flex; flex-direction:column; gap:6px;"></div>
  </div>

  <div class="tool-settings">
    <input type="color" id="colorPicker" class="color-picker-bubble" value="#3B4252">
    <input type="range" id="brushSize" class="brush-slider" min="1" max="50" value="8">
    <span class="pressure-pill" id="pressureVal">Stylus: 100%</span>
  </div>

  <nav class="bottom-dock">
    <button class="tool-btn active" data-tool="pen" type="button" title="Pluma">✒️</button>
    <button class="tool-btn" data-tool="marker" type="button" title="Marcador Fino">🖊️</button>
    <button class="tool-btn" data-tool="crayon" type="button" title="Crayón">🖍️</button>
    <button class="tool-btn" data-tool="eraser" type="button" title="Borrador">🧹</button>
    <button class="tool-btn" data-tool="smudge" type="button" title="Mezclar">💧</button>
    <button class="tool-btn" data-tool="pan" type="button" title="Mover Lienzo">✋</button>
  </nav>

  <div class="book-modal" id="bookModal">
    <div class="book-container">
      <div class="book-spine"></div>
      <div class="book-content">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <h2 style="margin:0; font-size:18px; color:var(--pastel-blue-dark);">Cuaderno de Bocetos</h2>
            <small style="color:#A0AEC0;">Hojas guardadas en el dispositivo</small>
          </div>
          <button class="pill-btn" id="closeBookModalBtn" type="button">Cerrar</button>
        </div>

        <div style="margin-top:14px;">
          <button class="pill-btn" id="savePageBtn" type="button" style="background: var(--pastel-blue-dark); color:white; width:100%; justify-content:center;">
            💾 Guardar Hoja Actual
          </button>
        </div>

        <div class="pages-grid" id="bookPagesGrid"></div>
      </div>
    </div>
  </div>

  <script>
    const state = {
      tool: 'pen',
      color: '#3B4252',
      size: 8,
      layers: [],
      currentLayerIdx: 0,
      undoStack: [],
      redoStack: [],
      isDrawing: false,
      lastX: 0,
      lastY: 0,
      pan: { x: 0, y: 0 },
      isPanning: false,
      panStart: { x: 0, y: 0 }
    };

    const canvasWrapper = document.getElementById('canvas-wrapper');
    const pressureVal = document.getElementById('pressureVal');
    const width = 380;
    const height = 580;

    function addLayer() {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      canvas.className = 'drawing-layer';
      const ctx = canvas.getContext('2d');
      
      if(state.layers.length === 0) {
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, width, height);
      }

      const layerObj = { canvas, ctx, name: `Capa ${state.layers.length + 1}` };
      state.layers.push(layerObj);
      canvasWrapper.appendChild(canvas);
      setActiveLayer(state.layers.length - 1);
      renderLayersList();
      saveState();
    }

    function setActiveLayer(idx) {
      state.currentLayerIdx = idx;
      renderLayersList();
    }

    function renderLayersList() {
      const list = document.getElementById('layersList');
      if (!list) return;
      list.innerHTML = '';
      state.layers.forEach((layer, idx) => {
        const item = document.createElement('div');
        item.className = `layer-item ${idx === state.currentLayerIdx ? 'active' : ''}`;
        item.innerHTML = `<span>${layer.name}</span> <small>${idx === 0 ? '(Fondo)' : ''}</small>`;
        item.onclick = () => setActiveLayer(idx);
        list.appendChild(item);
      });
    }

    function currentCtx() {
      return state.layers[state.currentLayerIdx]?.ctx;
    }

    function getCanvasCoords(e) {
      const rect = canvasWrapper.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left),
        y: (e.clientY - rect.top)
      };
    }

    // CONTROL DEL PUNTERO / STYLUS / RATÓN
    canvasWrapper.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      try { canvasWrapper.setPointerCapture(e.pointerId); } catch(err){}

      if (state.tool === 'pan') {
        state.isPanning = true;
        state.panStart = { x: e.clientX - state.pan.x, y: e.clientY - state.pan.y };
        return;
      }

      state.isDrawing = true;
      const coords = getCanvasCoords(e);
      state.lastX = coords.x;
      state.lastY = coords.y;

      drawStroke(e, true);
    });

    window.addEventListener('pointermove', (e) => {
      if (state.isPanning) {
        state.pan.x = e.clientX - state.panStart.x;
        state.pan.y = e.clientY - state.panStart.y;
        canvasWrapper.style.transform = `translate(${state.pan.x}px, ${state.pan.y}px)`;
        return;
      }
      if (!state.isDrawing) return;
      e.preventDefault();
      drawStroke(e, false);
    });

    const stopDrawing = (e) => {
      if (state.isDrawing) {
        state.isDrawing = false;
        saveState();
      }
      state.isPanning = false;
      try { if (e && e.pointerId) canvasWrapper.releasePointerCapture(e.pointerId); } catch(err){}
    };

    window.addEventListener('pointerup', stopDrawing);
    window.addEventListener('pointercancel', stopDrawing);

    function drawStroke(e, isStart) {
      const ctx = currentCtx();
      if (!ctx) return;
      const coords = getCanvasCoords(e);
      
      let pressure = 0.8;
      if (e.pressure !== undefined && e.pressure > 0) {
        pressure = e.pressure;
      }
      if (pressureVal) {
        pressureVal.innerText = `Stylus: ${Math.round(pressure * 100)}%`;
      }

      let strokeWidth = state.size * (pressure * 1.5);
      if (strokeWidth < 1) strokeWidth = 1;

      ctx.save();

      if (state.tool === 'pen' || (isStart && state.tool !== 'eraser')) {
        ctx.strokeStyle = state.color;
        ctx.fillStyle = state.color;
        ctx.lineWidth = strokeWidth;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.beginPath();
        ctx.moveTo(state.lastX, state.lastY);
        ctx.lineTo(coords.x, coords.y);
        ctx.stroke();

        // Punto de inicio al dar un toque
        if (isStart) {
          ctx.beginPath();
          ctx.arc(coords.x, coords.y, strokeWidth / 2, 0, Math.PI * 2);
          ctx.fill();
        }

      } else if (state.tool === 'marker') {
        ctx.globalAlpha = 0.45;
        ctx.strokeStyle = state.color;
        ctx.lineWidth = strokeWidth * 0.9;
        ctx.lineCap = 'square';
        ctx.beginPath();
        ctx.moveTo(state.lastX, state.lastY);
        ctx.lineTo(coords.x, coords.y);
        ctx.stroke();

      } else if (state.tool === 'crayon') {
        ctx.fillStyle = state.color;
        const dist = Math.hypot(coords.x - state.lastX, coords.y - state.lastY) || 1;
        for (let i = 0; i < dist; i += 2) {
          const t = i / dist;
          const px = state.lastX + (coords.x - state.lastX) * t;
          const py = state.lastY + (coords.y - state.lastY) * t;
          for (let p = 0; p < 6; p++) {
            const angle = Math.random() * Math.PI * 2;
            const r = Math.random() * strokeWidth;
            ctx.globalAlpha = Math.random() * 0.4;
            ctx.fillRect(px + Math.cos(angle)*r, py + Math.sin(angle)*r, 1.8, 1.8);
          }
        }

      } else if (state.tool === 'eraser') {
        ctx.globalCompositeOperation = state.currentLayerIdx === 0 ? 'source-over' : 'destination-out';
        ctx.strokeStyle = state.currentLayerIdx === 0 ? '#FFFFFF' : 'rgba(0,0,0,1)';
        ctx.lineWidth = strokeWidth * 1.8;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(state.lastX, state.lastY);
        ctx.lineTo(coords.x, coords.y);
        ctx.stroke();

      } else if (state.tool === 'smudge') {
        try {
          const sampleSize = Math.max(12, Math.floor(strokeWidth * 1.2));
          const imgData = ctx.getImageData(coords.x - sampleSize/2, coords.y - sampleSize/2, sampleSize, sampleSize);
          ctx.globalAlpha = 0.15;
          ctx.putImageData(imgData, coords.x - sampleSize/2 + (coords.x - state.lastX)*0.2, coords.y - sampleSize/2 + (coords.y - state.lastY)*0.2);
        } catch(e) {}
      }

      ctx.restore();
      state.lastX = coords.x;
      state.lastY = coords.y;
    }

    // HISTORIAL SEGURO (CON PROTECCIÓN TRY-CATCH)
    function saveState() {
      try {
        const activeCanvas = state.layers[state.currentLayerIdx]?.canvas;
        if (!activeCanvas) return;
        state.undoStack.push(activeCanvas.toDataURL());
        if (state.undoStack.length > 25) state.undoStack.shift();
        state.redoStack = [];
      } catch(err) {
        console.warn("Navegador protegiendo toDataURL:", err);
      }
    }

    function undo() {
      if (state.undoStack.length > 1) {
        state.redoStack.push(state.undoStack.pop());
        restoreState(state.undoStack[state.undoStack.length - 1]);
      }
    }

    function redo() {
      if (state.redoStack.length > 0) {
        const nextImgSrc = state.redoStack.pop();
        state.undoStack.push(nextImgSrc);
        restoreState(nextImgSrc);
      }
    }

    function restoreState(dataUrl) {
      if (!dataUrl) return;
      const img = new Image();
      img.src = dataUrl;
      img.onload = () => {
        const ctx = currentCtx();
        if (!ctx) return;
        ctx.clearRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0);
      };
    }

    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'z') undo();
      if (e.key.toLowerCase() === 'y') redo();
    });
    document.getElementById('undoBtn').onclick = undo;
    document.getElementById('redoBtn').onclick = redo;

    // HERRAMIENTAS
    document.querySelectorAll('.tool-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.tool = btn.dataset.tool;
      });
    });

    document.getElementById('colorPicker').oninput = (e) => state.color = e.target.value;
    document.getElementById('brushSize').oninput = (e) => state.size = e.target.value;

    // FOTO REFERENCIA
    const refPanel = document.getElementById('refPanel');
    const toggleRefBtn = document.getElementById('toggleRefBtn');
    const closeRefBtn = document.getElementById('closeRefBtn');
    const refInput = document.getElementById('refInput');
    const refImg = document.getElementById('refImg');
    const refPlaceholder = document.getElementById('refPlaceholder');
    const refDragHandle = document.getElementById('refDragHandle');

    toggleRefBtn.onclick = () => refPanel.classList.toggle('hidden');
    closeRefBtn.onclick = () => refPanel.classList.add('hidden');
    refPlaceholder.onclick = () => refInput.click();

    refInput.onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          refImg.src = evt.target.result;
          refImg.style.display = 'block';
          refPlaceholder.style.display = 'none';
        };
        reader.readAsDataURL(file);
      }
    };

    let isDraggingRef = false, refOffset = { x: 0, y: 0 };
    refDragHandle.addEventListener('pointerdown', (e) => {
      isDraggingRef = true;
      refOffset.x = e.clientX - refPanel.offsetLeft;
      refOffset.y = e.clientY - refPanel.offsetTop;
    });
    window.addEventListener('pointermove', (e) => {
      if (!isDraggingRef) return;
      refPanel.style.left = (e.clientX - refOffset.x) + 'px';
      refPanel.style.top = (e.clientY - refOffset.y) + 'px';
    });
    window.addEventListener('pointerup', () => isDraggingRef = false);

    // PANEL CAPAS
    document.getElementById('layersBtn').onclick = () => {
      document.getElementById('layersPanel').classList.toggle('open');
    };
    document.getElementById('addLayerBtn').onclick = addLayer;

    // MODAL LIBRO / CARPETA
    const bookModal = document.getElementById('bookModal');
    const bookPagesGrid = document.getElementById('bookPagesGrid');
    document.getElementById('openBookBtn').onclick = () => {
      renderBookPages();
      bookModal.classList.add('open');
    };
    document.getElementById('closeBookModalBtn').onclick = () => bookModal.classList.remove('open');

    function mergeLayersToCanvas() {
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = width;
      exportCanvas.height = height;
      const expCtx = exportCanvas.getContext('2d');
      state.layers.forEach(layer => expCtx.drawImage(layer.canvas, 0, 0));
      return exportCanvas;
    }

    document.getElementById('savePageBtn').onclick = () => {
      try {
        const merged = mergeLayersToCanvas();
        const dataUrl = merged.toDataURL('image/png');

        let pages = JSON.parse(localStorage.getItem('drafty_book_pages') || '[]');
        pages.unshift({ id: Date.now(), img: dataUrl, date: new Date().toLocaleDateString() });
        localStorage.setItem('drafty_book_pages', JSON.stringify(pages));

        const link = document.createElement('a');
        link.download = `Drafty_Hoja_${Date.now()}.png`;
        link.href = dataUrl;
        link.click();

        renderBookPages();
        alert('¡Hoja guardada en tu libro y en tu dispositivo!');
      } catch(err) {
        alert('No se pudo exportar la imagen. Verifica los permisos de tu navegador.');
      }
    };

    function renderBookPages() {
      let pages = JSON.parse(localStorage.getItem('drafty_book_pages') || '[]');
      bookPagesGrid.innerHTML = '';
      if(pages.length === 0) {
        bookPagesGrid.innerHTML = '<p style="grid-column: span 2; text-align:center; color:#94A3B8; font-size:12px;">Aún no tienes hojas en tu libro. ¡Dibuja algo!</p>';
        return;
      }
      pages.forEach(p => {
        const card = document.createElement('div');
        card.className = 'page-card';
        card.innerHTML = `<img src="${p.img}" /><span style="font-size:11px; margin-top:4px; color:#64748B;">${p.date}</span>`;
        bookPagesGrid.appendChild(card);
      });
    }

    // Inicializar capa base
    addLayer();
  </script>
</body>
</html>
